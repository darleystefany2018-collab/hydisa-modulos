<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HYDISA</title>
  <!-- Tipografía suave (Google Fonts). Sin internet se usa una por defecto. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap">
  <!-- Estilos: todo el aspecto visual vive en este archivo -->
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ICONOS: caja de iconos reutilizable. Cada <symbol> se dibuja luego con <use href="#nombre"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M10 20V8M15 20v-5M20 20V4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M9 14l2 2 4-4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c3-4 6-7 10-9"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h11M10 8h5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
  </svg>

  <!-- MÓDULO 0: PANTALLA DE ACCESO (inicio de sesión / crear cuenta). Se ve ANTES de toda la app. La dibuja js/acceso.js -->
  <div id="pantallaAcceso" class="acceso-pantalla" hidden></div>

  <!-- Contenedor general: simula la pantalla de un celular -->
  <div class="app">

    <!-- MÓDULOS 1 y 2: CABECERA (siempre visible)
         1. Botón de menú principal (abre el panel lateral).
         2. Perfil del usuario y campana de notificaciones. -->
    <header class="cabecera">
      <button id="btnMenu" class="icono-btn" aria-label="Abrir menú">
        <svg class="icono"><use href="#i-menu"/></svg>
      </button>
      <div class="perfil">
        <button class="perfil__avatar" id="btnPerfil" aria-label="Ver mi perfil">
          <svg class="icono"><use href="#i-user"/></svg>
        </button>
        <div class="perfil__datos">
          <span id="saludo" class="perfil__saludo">Hola</span>
          <button id="btnCampana" class="campana" aria-label="Notificaciones">
            <svg class="icono"><use href="#i-bell"/></svg>
            <span id="puntoNotificacion" class="campana__punto" hidden></span>
          </button>
        </div>
      </div>
    </header>

    <!-- ZONA DE VISTAS: aquí el router (router.js) dibuja la pantalla activa:
         inicio, ruta, actividad, registro, evolución, calendario, etc. -->
    <main id="vista" class="contenido"></main>

    <!-- MÓDULO 8: NAVEGACIÓN PRINCIPAL (barra inferior). La dibuja js/menu.js -->
    <nav id="navegacion" class="navegacion" aria-label="Navegación principal"></nav>
  </div>

  <!-- Panel lateral del MÓDULO 1 (se abre con el botón de menú). Lo llena js/menu.js -->
  <div id="velo" class="velo" hidden></div>
  <aside id="panelMenu" class="panel" aria-hidden="true">
    <button id="btnCerrarMenu" class="icono-btn panel__cerrar" aria-label="Cerrar menú">
      <svg class="icono"><use href="#i-close"/></svg>
    </button>
    <p class="panel__titulo">Menú</p>
    <ul id="listaMenu" class="panel__lista"></ul>
  </aside>

  <!-- HOJA: ventana que sube desde abajo (intención, notificaciones, recursos...) -->
  <div id="hojaVelo" class="velo velo--hoja" hidden></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo" hidden>
    <div class="hoja__cabecera">
      <h2 id="hojaTitulo" class="hoja__titulo"></h2>
      <button id="btnCerrarHoja" class="icono-btn" aria-label="Cerrar"><svg class="icono"><use href="#i-close"/></svg></button>
    </div>
    <div id="hojaCuerpo" class="hoja__cuerpo"></div>
  </section>

  <!-- Mensaje flotante breve -->
  <div id="aviso" class="aviso" role="status" hidden></div>

  <!-- ===== SCRIPTS: el orden importa (cada uno usa lo que cargó el anterior) ===== -->
  <script src="js/datos.js"></script>          <!-- contenido fijo: actividades, recursos, secciones -->
  <script src="js/almacen.js"></script>        <!-- estado de la persona y guardado en el navegador -->
  <script src="js/ui.js"></script>             <!-- ayudas: avisos, hojas, iconos -->
  <script src="js/api.js"></script>            <!-- conexión con el servidor de Python (servidor.py) -->
  <script src="js/router.js"></script>         <!-- cambia de pantalla según la dirección (#/ruta) -->
  <script src="js/notificaciones.js"></script> <!-- MÓDULO 2 -->
  <script src="js/intencion.js"></script>      <!-- MÓDULO 4 -->
  <script src="js/vistas/inicio.js"></script>  <!-- MÓDULOS 3, 4, 5, 6 y 7 (pantalla de inicio) -->
  <script src="js/vistas/ruta.js"></script>
  <script src="js/vistas/actividad.js"></script>
  <script src="js/vistas/registro.js"></script>
  <script src="js/vistas/evolucion.js"></script>
  <script src="js/vistas/calendario.js"></script>
  <script src="js/vistas/acompanamiento.js"></script>
  <script src="js/vistas/recursos.js"></script>
  <script src="js/vistas/analisis.js"></script> <!-- Mi análisis: usa todas las funciones de main.py -->
  <script src="js/vistas/perfil.js"></script>
  <script src="js/menu.js"></script>           <!-- MÓDULOS 1 y 8 -->
  <script src="js/acceso.js"></script>         <!-- MÓDULO 0: inicio de sesión y registro -->
  <script src="js/main.js"></script>           <!-- arranque -->
</body>
</html>
